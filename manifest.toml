#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "zoraxy"
name = "Zoraxy"
description.en = "General purpose HTTP reverse proxy and forwarding tool"
description.fr = "Outil de proxy inverse et de transfert HTTP à usage général"

version = "3.3.3~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://zoraxy.aroz.org/"
admindoc = "https://github.com/tobychui/zoraxy/wiki/Getting-Started"
code = "https://github.com/tobychui/zoraxy"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "zoraxy"
    amd64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.3/zoraxy_linux_amd64"
    amd64.sha256 = "c78f03e18503c1d7344fd4e2ebed0dd12686994c0c5188d6eeb939a5573f7a39"
    armhf.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.3/zoraxy_linux_arm"
    armhf.sha256 = "cdc01ca289b229952925d0229fa0260a7b91e5db3afe680110f8709c2ea85e08"
    arm64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.3/zoraxy_linux_arm64"
    arm64.sha256 = "d004e188d7af356ff6f30bb1ee0da18ce65dab352189cabe827a564de0ba374f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "zoraxy_linux_amd64"
    autoupdate.asset.arm64 = "zoraxy_linux_arm64"
    autoupdate.asset.armhf = "zoraxy_linux_arm$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
