#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "zoraxy"
name = "Zoraxy"
description.en = "General purpose HTTP reverse proxy and forwarding tool"
description.fr = "Outil de proxy inverse et de transfert HTTP à usage général"

version = "3.3.4~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://zoraxy.aroz.org/"
admindoc = "https://github.com/tobychui/zoraxy/wiki/Getting-Started"
code = "https://github.com/tobychui/zoraxy"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "zoraxy"
    amd64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.4/zoraxy_linux_amd64"
    amd64.sha256 = "452b9bfd3e54e24853b6ad27555b1727be0e85f356f5c8487da9d2f28497b298"
    armhf.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.4/zoraxy_linux_arm"
    armhf.sha256 = "bf1baf59cdce38ff02bc50bdc35c724888032bd4dcad9c56ef69b5d5a4a262eb"
    arm64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.4/zoraxy_linux_arm64"
    arm64.sha256 = "69c48be034c9b5016660e3f4f0f75b2940e82e0a1b7e0f55675ece9738b77d57"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "zoraxy_linux_amd64"
    autoupdate.asset.arm64 = "zoraxy_linux_arm64"
    autoupdate.asset.armhf = "zoraxy_linux_arm$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
