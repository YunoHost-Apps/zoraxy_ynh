#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "zoraxy"
name = "Zoraxy"
description.en = "General purpose HTTP reverse proxy and forwarding tool"
description.fr = "Outil de proxy inverse et de transfert HTTP à usage général"

version = "3.3.2~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://zoraxy.aroz.org/"
admindoc = "https://github.com/tobychui/zoraxy/wiki/Getting-Started"
code = "https://github.com/tobychui/zoraxy"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "zoraxy"
    amd64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.2/zoraxy_linux_amd64"
    amd64.sha256 = "1faabf9439488c2d8e55c51a493b3a7eb348451cb4166c033abf0f0bc1c90d6f"
    armhf.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.2/zoraxy_linux_arm"
    armhf.sha256 = "121cb2fa6cff41e3abea8eb045fc9011cb79386c91afdf9cc68a5a58022a680e"
    arm64.url = "https://github.com/tobychui/zoraxy/releases/download/v3.3.2/zoraxy_linux_arm64"
    arm64.sha256 = "1b866b06e81e9f11ee28dbfc61bdfa212758d0d9ccf7ccfcb10f33b4a5d41b02"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "zoraxy_linux_amd64"
    autoupdate.asset.arm64 = "zoraxy_linux_arm64"
    autoupdate.asset.armhf = "zoraxy_linux_arm$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
